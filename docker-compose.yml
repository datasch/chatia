version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chatia-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chatia}
      POSTGRES_USER: ${DB_USER:-chatia}
      POSTGRES_PASSWORD: ${DB_PASS:-${DB_PASSWORD:-chatia}}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chatia} -d ${DB_NAME:-chatia}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: chatia-redis-prod
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass $$REDIS_PASSWORD
        else
          redis-server
        fi
      "
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatia-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - backend-public:/app/public
      - backend-uploads:/app/uploads
      - backend-certs:/app/certs
      - backend-wwebjs-auth:/app/.wwebjs_auth
      - backend-wwebjs-cache:/app/.wwebjs_cache
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-chatia}
      - DB_USER=${DB_USER:-chatia}
      - DB_PASS=${DB_PASS:-${DB_PASSWORD:-chatia}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL}
        - REACT_APP_NAME_SYSTEM=${REACT_APP_NAME_SYSTEM}
        - REACT_APP_COMPANY_NAME=${REACT_APP_COMPANY_NAME}
        - REACT_APP_NUMBER_SUPPORT=${REACT_APP_NUMBER_SUPPORT}
        - REACT_APP_HOURS_CLOSE_TICKETS_AUTO=${REACT_APP_HOURS_CLOSE_TICKETS_AUTO}
        - REACT_APP_PRIMARY_COLOR=${REACT_APP_PRIMARY_COLOR}
        - REACT_APP_PRIMARY_DARK=${REACT_APP_PRIMARY_DARK}
        - REACT_APP_REQUIRE_BUSINESS_MANAGEMENT=${REACT_APP_REQUIRE_BUSINESS_MANAGEMENT}
    container_name: chatia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  redis_data_prod:
  backend-public:
  backend-uploads:
  backend-certs:
  backend-wwebjs-auth:
  backend-wwebjs-cache:
